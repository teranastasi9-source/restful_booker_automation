name: Tests
# run-name gives each individual run a title matching what actually triggered it, shown in the
# Actions run list and when picking "Run workflow" manually - the static name above doesn't
# distinguish push/PR from a scheduled/manual run, unlike this. Same pattern as the
# playwright_ui_automation sibling project's workflow.
run-name: >-
  ${{ github.event_name == 'schedule' && 'Weekly scheduled tests + Pages deploy'
   || github.event_name == 'workflow_dispatch' && 'Tests + Pages deploy (manual)'
   || format('Tests - {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Once a week (Monday), independent of anyone pushing - catches drift caused by the
    # public restful-booker.herokuapp.com API itself, not just code changes. Was daily until
    # 2026-08-05: the playwright_ui_automation sibling project's OrangeHRM demo had a genuinely
    # bad evening that night (verified directly, independent of CI), producing several days'
    # worth of red runs to triage for no real signal - dropped all three portfolio repos to
    # weekly together rather than waiting to see if this one hits the same pattern. Run on
    # demand via workflow_dispatch any time a fresh report is actually needed.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Update test-count badge
        # Dynamic instead of hand-maintained: pytest --collect-only needs no network access
        # (unlike the real test job below, which hits the live API), so it's cheap to run here
        # on every push to main. Only commits back when the count actually changed, and
        # [skip ci] on that commit avoids re-triggering this whole workflow on its own
        # badge-update push. Same pattern as the playwright_ui_automation sibling project.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COUNT=$(pytest --collect-only -q tests | tail -1 | grep -oE '^[0-9]+')
          mkdir -p .github/badges
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"$COUNT\",\"color\":\"brightgreen\"}" > .github/badges/tests.json
          if ! git diff --quiet -- .github/badges/tests.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/badges/tests.json
            git commit -m "chore: update test-count badge to $COUNT [skip ci]"
            git push
          else
            echo "Test count unchanged ($COUNT) - nothing to commit."
          fi

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      # Public restful-booker demo values (not secrets) - same ones documented
      # in env.example. MAX_RESPONSE_TIME leaves headroom for CI network
      # variance and the free Heroku dyno's occasional cold-start slowness
      # (same pattern as the playwright_ui_automation sibling project).
      BASE_URL: https://restful-booker.herokuapp.com
      MOCK_URL: https://b46c2b66-2cdd-4ff5-abb5-388678ae176d.mock.pstmn.io
      USER: admin
      PASSWORD: password123
      MAX_RESPONSE_TIME: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
      - name: Upload report (always, so failures are inspectable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          retention-days: 14
      - name: Open an issue on nightly failure
        # Only for the scheduled run, not push/PR/workflow_dispatch - those are
        # already being watched live. Not a verdict on whether this is a real
        # regression or an external-API flake (see triage-api-test-failure
        # skill) - just a "don't let this go unnoticed" safety net.
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly test run failed (run #${context.runNumber})`,
              body: [
                `The scheduled nightly test run failed.`,
                ``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Not yet triaged - this could be a real regression or an external-API`,
                `hiccup (the free Heroku dyno this API runs on can be slow to wake up).`,
                `Use the \`triage-api-test-failure\` skill (re-run in isolation, verify`,
                `the external state directly) before assuming either way.`
              ].join("\n"),
              labels: ["bug", "ci-failure"]
            })

  pages:
    name: Deploy latest report to GitHub Pages
    needs: test
    # On push to main, schedule, or manual dispatch - not PRs, Pages should reflect main's
    # state, not a preview branch. Also runs on schedule/workflow_dispatch (fixed 2026-08-05:
    # previously only push, which silently broke the "run on demand via workflow_dispatch for
    # a fresh report" promise made when the schedule moved from daily to weekly - test itself
    # has no such restriction, so tests would run on a manual dispatch but never actually
    # reach Pages). Requires Pages enabled once in repo Settings > Pages > Source:
    # "GitHub Actions" (a one-time manual step, not something a workflow file can set).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-report
          path: reports/
      - name: Stage the report as the Pages site root
        # report_IntegrationWorkflows.html is fully self-contained (pytest.ini's
        # --self-contained-html inlines CSS/JS), so it can be served as-is.
        run: |
          mkdir -p _site
          cp reports/report_IntegrationWorkflows.html _site/index.html
      - name: Delete stale github-pages artifact from a previous attempt, if any
        # Re-running this workflow leaves the previous attempt's already-uploaded
        # "github-pages" artifact in place - upload-pages-artifact always uses that fixed name,
        # so a second attempt collides with it and deploy-pages fails with "Multiple artifacts
        # named github-pages... Artifact count is 2" (same issue verified 2026-08-05 in the
        # playwright_ui_automation sibling project). No-op on a normal first attempt.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' |
          while read -r artifact_id; do
            echo "Deleting stale github-pages artifact $artifact_id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
